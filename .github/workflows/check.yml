name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install legacy Word converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: node --check src/shipping_agent/web.js
      - run: uv run python scripts/check_docs.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bozhi-check .
      - name: Verify container API and legacy DOC parsing
        run: |
          docker run -d --name bozhi-check -e API_TOKEN=ci-synthetic-token -v "$PWD/examples/acceptance:/fixtures:ro" bozhi-check
          for attempt in $(seq 1 30); do
            if docker exec bozhi-check python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8010/health').status == 200"; then break; fi
            sleep 1
          done
          docker exec bozhi-check python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8010/health').status == 200"
          docker exec bozhi-check uv run --frozen python -c "from pathlib import Path; from shipping_agent.config import Settings; from shipping_agent.parsers import Parser; s=Parser(Settings()).parse_file(Path('/fixtures/doc-credit/credit.doc'))[0]; assert s.method == 'libreoffice+python-docx' and 'SYN-ORIGINAL-001' in s.text and not s.issues"
