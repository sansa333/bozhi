<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="从一份材料，到可核查的账单建议"><rect width="1400" height="620" fill="#f5f7f4"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86a18b"/></marker></defs><text x="60" y="47" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#6f927b">BOZHI / 泊知</text><text x="60" y="99" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="600" fill="#1e4137">从一份材料，到可核查的账单建议</text><text x="60" y="138" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#738679">输入清楚、处理有依据、输出可复核。</text><rect x="60" y="186" width="360" height="277" rx="20" fill="#eaf2e8" stroke="#dce7df"/><text x="85" y="230" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#386449">01  上传材料</text><circle cx="88" cy="276" r="3" fill="#8aab8d"/><text x="104" y="282" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">邮件正文与递归附件</text><circle cx="88" cy="321" r="3" fill="#8aab8d"/><text x="104" y="327" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">PDF、扫描图片</text><circle cx="88" cy="366" r="3" fill="#8aab8d"/><text x="104" y="372" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">Excel、Word 费用表</text><circle cx="88" cy="411" r="3" fill="#8aab8d"/><text x="104" y="417" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">已有账单 JSON 与记账主体</text><rect x="520" y="186" width="360" height="277" rx="20" fill="#fff" stroke="#dce7df"/><text x="545" y="230" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#386449">02  提取与核对</text><circle cx="548" cy="276" r="3" fill="#8aab8d"/><text x="564" y="282" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">按格式解析，按需调用 OCR</text><circle cx="548" cy="321" r="3" fill="#8aab8d"/><text x="564" y="327" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">大模型提取字段与原文依据</text><circle cx="548" cy="366" r="3" fill="#8aab8d"/><text x="564" y="372" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">校验金额、币种、合计与重复</text><circle cx="548" cy="411" r="3" fill="#8aab8d"/><text x="564" y="417" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">匹配旧账，只更新明确变更</text><rect x="980" y="186" width="360" height="277" rx="20" fill="#edf3ed" stroke="#dce7df"/><text x="1005" y="230" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#386449">03  查看与导出</text><circle cx="1008" cy="276" r="3" fill="#8aab8d"/><text x="1024" y="282" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">新增 / 更新 / 保留 / 待确认</text><circle cx="1008" cy="321" r="3" fill="#8aab8d"/><text x="1024" y="327" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">按费用与单据搜索、筛选</text><circle cx="1008" cy="366" r="3" fill="#8aab8d"/><text x="1024" y="372" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">逐字段查看来源和处理依据</text><circle cx="1008" cy="411" r="3" fill="#8aab8d"/><text x="1024" y="417" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#627860">下载标准 JSON 或 CSV</text><path d="M440 325h58" stroke="#86a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 325h58" stroke="#86a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="500" width="1280" height="73" rx="20" fill="#e9f0e5" stroke="#dce7d7"/><text x="88" y="543" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="400" fill="#5d7b54">遇到缺失信息、冲突或低置信度时，明确标为待确认。系统生成操作建议，不直接入账。</text></svg>