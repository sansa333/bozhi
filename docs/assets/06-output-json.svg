preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">  },</text><text x="85" y="461" xml:space="preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">  &quot;financial_attributes&quot;: {&quot;posting_type&quot;: &quot;AP&quot;},</text><text x="85" y="491" xml:space="preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">  &quot;audit_trail&quot;: {</text><text x="85" y="521" xml:space="preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">    &quot;changed_fields&quot;: [&quot;charge_details.amount&quot;],</text><text x="85" y="551" xml:space="preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">    &quot;previous_values&quot;: {&quot;charge_details.amount&quot;: 30.0}</text><text x="85" y="581" xml:space="preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">  }</text><text x="85" y="611" xml:space="preserve" font-family="Consolas,monospace" font-size="18" fill="#dfebd5">}</text><rect x="960" y="180" width="380" height="140" rx="20" fill="#edf3e8" stroke="#dce7df"/><text x="983" y="222" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="600" fill="#456b40">操作建议</text><text x="983" y="259" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#788d6d">UPDATE，仍由人确认后入账</text><rect x="960" y="342" width="380" height="140" rx="20" fill="#edf3e8" stroke="#dce7df"/><text x="983" y="384" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="600" fill="#456b40">保留原值</text><text x="983" y="421" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#788d6d">金额从 30.00 改为 40.00</text><rect x="960" y="504" width="380" height="140" rx="20" fill="#edf3e8" stroke="#dce7df"/><text x="983" y="546" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="19" f