<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="输入什么，输出什么？"><rect width="1400" height="620" fill="#f5f7f4"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86a18b"/></marker></defs><text x="60" y="47" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#6f927b">BOZHI / 泊知</text><text x="60" y="99" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="600" fill="#1e4137">输入什么，输出什么？</text><text x="60" y="138" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#738679">三种典型情况，用同一批材料一起演示。所有公司、邮箱和单据均为合成数据。</text><rect x="60" y="182" width="590" height="355" rx="20" fill="#fff" stroke="#dce7df"/><rect x="750" y="182" width="590" height="355" rx="20" fill="#eef4ea" stroke="#dce7df"/><text x="86" y="225" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="600" fill="#3b6749">输入：仓库自带的合成演示材料</text><text x="87" y="270" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#47624a">01-new-invoice.eml</text><text x="87" y="297" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#7b8a73">Handling Fee 65.00 USD；Doc Fee 35.00 USD</text><text x="87" y="337" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#47624a">02-update-instruction.eml</text><text x="87" y="364" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#7b8a73">明确要求将 Handling Fee 更新为 USD 40.00</text><text x="87" y="404" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#47624a">03-currency-to-confirm.eml</text><text x="87" y="431" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#7b8a73">只有 $50.00，未明确是哪一种美元</text><text x="87" y="471" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#47624a">existing-bills.json</text><text x="87" y="498" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#7b8a73">原账金额 USD 30.00；记账公司 Demo Trading Ltd</text><path d="M675 355h48" stroke="#86a18b" stroke-width="2" marker-end="url(#arrow)"/><text x="776" y="225" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="23" font-weight="600" fill="#3b6749">输出：每个费用项目单独一条记录</text><text x="777" y="270" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#6b9265">CREATE</text><text x="777" y="297" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#72856a">65.00 与 35.00 两条新增建议</text><text x="777" y="337" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#6c8ba2">UPDATE</text><text x="777" y="364" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#72856a">30.00 → 40.00；未修改的字段继承原值</text><text x="777" y="404" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#aa8a50">PENDING_REVIEW</text><text x="777" y="431" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#72856a">保留金额 50.00，币种为 null，等待确认</text><text x="777" y="471" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#6b9265">JSON / CSV</text><text x="777" y="498" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#72856a">同时保留原文证据、来源和处理说明</text><text x="61" y="581" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="400" fill="#8b977f">以上为合成案例的预期业务行为；本次实际调用结果和截图见下方演示报告。</text></svg>